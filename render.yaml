services:
  - type: web
    name: beatvault
    env: node
    buildCommand: |
      npm ci
      apt-get update -y
      apt-get install -y ffmpeg wget unzip
      # Download deno.exe (Linux)
      wget https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-linux.zip -O deno.zip
      unzip deno.zip
      chmod +x deno
      mv deno deno.exe
      # Download yt-dlp
      wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -O yt-dlp.exe
      chmod +x yt-dlp.exe
    startCommand: npm start
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
